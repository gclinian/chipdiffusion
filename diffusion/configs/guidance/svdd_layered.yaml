model:
  # SVDD mode dispatch — but with svdd_layer_opt=True, opt's gradient guidance
  # is layered onto predicted_x0 each reverse step before SVDD candidate sampling.
  guidance_mode: svdd

  # Opt guidance params (sourced from configs/guidance/opt.yaml + CLAUDE.md tuned overrides)
  guidance_step: 1000
  forward_guidance_weight: 0.0
  grad_descent_rate: 8e-3
  grad_descent_steps: 20            # CLAUDE.md tuned for ISPD (vs opt.yaml default 10)
  hpwl_guidance_weight: 16e-4       # CLAUDE.md tuned for ISPD (vs opt.yaml default 1e-4)
  legality_guidance_weight: 0.0
  alpha_init: 0.0
  alpha_lr: 5e-4
  alpha_critical_factor: 0.5
  legality_potential_target: 1e-4
  use_adam: True
  legality_softmax_factor_min: 10.0
  legality_softmax_factor_max: 20.0
  legality_softmax_critical_factor: 0.1

  # SVDD-PM params (same as svdd.yaml + Phase 2 best aggressive config)
  svdd_num_candidates: 4
  svdd_alpha_temp: 1.0
  svdd_lambda_legality: 1.0
  svdd_every_n_steps: 1
  svdd_start_step_frac: 0.5
  svdd_layer_opt: True
