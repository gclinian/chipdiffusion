model:
  # TDS (Twisted Diffusion Sampler / SMC) with layered opt guidance. arXiv:2306.17775.
  guidance_mode: tds

  # Opt guidance params (same as svdd_layered.yaml / code_layered.yaml)
  guidance_step: 1000
  forward_guidance_weight: 0.0
  grad_descent_rate: 8e-3
  grad_descent_steps: 20
  hpwl_guidance_weight: 16e-4
  legality_guidance_weight: 0.0
  alpha_init: 0.0
  alpha_lr: 5e-4
  alpha_critical_factor: 0.5
  legality_potential_target: 1e-4
  use_adam: True
  legality_softmax_factor_min: 10.0
  legality_softmax_factor_max: 20.0
  legality_softmax_critical_factor: 0.1

  # TDS params (matched to SVDD K=4, λ=1, α_temp=1 for direct comparison)
  tds_num_particles: 4
  tds_alpha_temp: 1.0
  tds_lambda_legality: 1.0
  tds_ess_threshold_frac: 0.5
  tds_layer_opt: True
